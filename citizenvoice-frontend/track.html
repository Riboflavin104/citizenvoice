<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaints | CitizenVoice</title>
    <meta name="description" content="Track the status of your civic complaints on CitizenVoice. See real-time updates from your local municipal authority.">


    <link rel="stylesheet" href="style1.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Track Your Complaints</h1>
        <p>See the status of everything you've submitted</p>
    </header>

    <main class="container">
        <div id="complaintsList">Loading your complaints...</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="track.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('cookieConsent')) return;
            var banner = document.createElement('div');
            banner.id = 'cookieBanner';
            banner.innerHTML =
                '<span>We use cookies to improve your experience. ' +
                '<a href="privacy-policy.html" style="color:#a465ec;">Learn more</a></span>' +
                '<button id="cookieAccept">Accept</button>';
            banner.style.cssText =
                'position:fixed;bottom:0;left:0;width:100%;background:#30204d;color:#fff;' +
                'padding:14px 20px;display:flex;align-items:center;justify-content:center;' +
                'gap:20px;font-size:14px;z-index:9999;';
            var btn = banner.querySelector('#cookieAccept');
            btn.style.cssText =
                'background:#8120dc;color:#fff;border:none;padding:8px 18px;' +
                'border-radius:5px;cursor:pointer;font-weight:bold;';
            document.body.appendChild(banner);
            document.getElementById('cookieAccept').addEventListener('click', function () {
                localStorage.setItem('cookieConsent', 'true');
                banner.style.display = 'none';
            });
        });
    </script>
</body>
</html>
